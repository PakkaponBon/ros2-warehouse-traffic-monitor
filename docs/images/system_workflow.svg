<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-labelledby="title description">
  <title id="title">Warehouse localization and traffic monitoring workflow</title>
  <desc id="description">Flow from forklift sensors and UWB through AMCL localization, traffic recording, SQLite storage, the web monitor, and dashboard summaries. A separate dashed lane shows the simulation-only movement loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07131f"/><stop offset="1" stop-color="#0b2031"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#02070c" flood-opacity=".35"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#54d6c6"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c58cff"/></marker>
    <style>
      text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#edf8ff}.title{font-size:34px;font-weight:750}.subtitle{font-size:17px;fill:#9fb8ca}.lane{fill:#0d2131;stroke:#28475d;stroke-width:2}.lane-title{font-size:17px;font-weight:750;letter-spacing:1.8px;fill:#82a9c2}.node rect{fill:#102a3d;stroke:#3d6a83;stroke-width:2;rx:14;filter:url(#shadow)}.node.core rect{stroke:#36c9b5}.node.support rect{stroke:#f1bd58}.node.storage rect{stroke:#69aef5}.node.output rect{fill:#11293a;stroke:#56768b}.node-title{font-size:20px;font-weight:750}.node-copy{font-size:14px;fill:#a9c1d0}.node-note{font-size:13px;fill:#6fe3d4;font-weight:650}.support-note{fill:#ffd47c}.arrow{fill:none;stroke:#54d6c6;stroke-width:3;marker-end:url(#arrow)}.arrow-muted{fill:none;stroke:#53849b;stroke-width:2.5;marker-end:url(#arrow)}.arrow-sim{fill:none;stroke:#c58cff;stroke-width:3;stroke-dasharray:10 7;marker-end:url(#arrow-purple)}.pill{fill:#113c3b;stroke:#36c9b5}.pill-text{font-size:12px;font-weight:750;fill:#72eadb;letter-spacing:1px}.footer{font-size:14px;fill:#9fb8ca}
    </style>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg)"/>
  <text x="48" y="58" class="title">Warehouse localization and traffic monitoring</text>
  <text x="48" y="88" class="subtitle">Current simulation workflow and the reusable core intended for real forklifts</text>
  <rect x="1218" y="39" width="18" height="18" rx="4" fill="#102a3d" stroke="#36c9b5" stroke-width="2"/><text x="1247" y="54" class="node-copy">Core system</text>
  <rect x="1370" y="39" width="18" height="18" rx="4" fill="#241c35" stroke="#c58cff" stroke-width="2" stroke-dasharray="5 3"/><text x="1399" y="54" class="node-copy">Simulation only</text>

  <rect x="40" y="120" width="1520" height="320" rx="22" class="lane"/><text x="66" y="153" class="lane-title">1 · LOCALIZE EACH FORKLIFT</text>
  <g class="node" transform="translate(70 182)"><rect width="240" height="70"/><text x="18" y="29" class="node-title">2D LiDAR</text><text x="18" y="53" class="node-copy">LaserScan of warehouse structure</text></g>
  <g class="node" transform="translate(70 270)"><rect width="240" height="70"/><text x="18" y="29" class="node-title">Wheel odometry</text><text x="18" y="53" class="node-copy">Motion estimate and speed</text></g>
  <g class="node" transform="translate(70 358)"><rect width="240" height="56"/><text x="18" y="25" class="node-title">Saved 2D map</text><text x="18" y="45" class="node-copy">Static warehouse reference</text></g>
  <path d="M310 217H390V253" class="arrow-muted"/><path d="M310 305H390" class="arrow-muted"/><path d="M310 386H390V337" class="arrow-muted"/>
  <g class="node core" transform="translate(390 235)"><rect width="275" height="120"/><text x="22" y="36" class="node-title">AMCL localization</text><text x="22" y="64" class="node-copy">Matches LiDAR against the map</text><text x="22" y="88" class="node-copy">using odometry for motion</text><text x="22" y="109" class="node-note">AUTHORITATIVE x, y, yaw + covariance</text></g>
  <g class="node support" transform="translate(740 182)"><rect width="245" height="70"/><text x="18" y="29" class="node-title">UWB position</text><text x="18" y="53" class="node-copy">Independent supporting estimate</text></g>
  <g class="node support" transform="translate(740 277)"><rect width="245" height="92"/><text x="18" y="30" class="node-title">AMCL initializer</text><text x="18" y="55" class="node-copy">Startup or stopped recovery</text><text x="18" y="77" class="node-note support-note">UWB does not replace AMCL</text></g>
  <path d="M862 252V277" class="arrow"/><path d="M740 323H690Q665 323 665 315" class="arrow"/>
  <g class="node core" transform="translate(1080 235)"><rect width="275" height="120"/><text x="22" y="35" class="node-title">Localization validator</text><text x="22" y="63" class="node-copy">Continuously compares AMCL</text><text x="22" y="85" class="node-copy">with time-aligned UWB</text><text x="22" y="108" class="node-note">confirmed · caution · disagree</text></g>
  <path d="M665 278H1040Q1080 278 1080 285" class="arrow"/><path d="M985 217H1030Q1080 217 1080 260" class="arrow"/>
  <g class="node output" transform="translate(1390 252)"><rect width="140" height="86"/><text x="16" y="28" class="node-title">Status</text><text x="16" y="51" class="node-copy">Pose quality</text><text x="16" y="70" class="node-copy">UWB agreement</text></g><path d="M1355 295H1390" class="arrow"/>

  <rect x="40" y="462" width="1520" height="230" rx="22" class="lane"/><text x="66" y="495" class="lane-title">2 · CLASSIFY TRAFFIC AND STORE HISTORY</text>
  <g class="node core" transform="translate(85 535)"><rect width="250" height="105"/><text x="20" y="34" class="node-title">Trusted telemetry</text><text x="20" y="61" class="node-copy">AMCL pose + odometry speed</text><text x="20" y="84" class="node-copy">localization and sensor status</text></g><path d="M527 355V465Q527 515 335 573" class="arrow-muted"/>
  <g class="node core" transform="translate(430 525)"><rect width="300" height="125"/><text x="22" y="36" class="node-title">Traffic recorder</text><text x="22" y="64" class="node-copy">Calculates motion state and events</text><text x="22" y="88" class="node-copy">moving · slow · waiting · blocked</text><text x="22" y="111" class="node-note">stuck + congestion after thresholds</text></g><path d="M335 587H430" class="arrow"/>
  <g class="node storage" transform="translate(820 535)"><rect width="250" height="105"/><text x="22" y="35" class="node-title">SQLite history</text><text x="22" y="63" class="node-copy">Positions, events, validation</text><text x="22" y="86" class="node-copy">and time-range records</text></g><path d="M730 587H820" class="arrow"/>
  <g class="node core" transform="translate(1160 535)"><rect width="300" height="105"/><text x="22" y="35" class="node-title">Web monitor API</text><text x="22" y="63" class="node-copy">Queries history and reads live</text><text x="22" y="86" class="node-copy">ROS diagnostics</text></g><path d="M1070 587H1160" class="arrow"/>

  <rect x="40" y="715" width="1520" height="230" rx="22" class="lane"/><text x="66" y="748" class="lane-title">3 · EXPLAIN WHAT HAPPENED</text>
  <path d="M1310 640V775H210V800" class="arrow-muted"/><path d="M520 775V800" class="arrow-muted"/><path d="M830 775V800" class="arrow-muted"/><path d="M1160 775V800" class="arrow-muted"/>
  <g class="node output" transform="translate(80 800)"><rect width="260" height="105"/><text x="20" y="34" class="node-title">Traffic heatmap</text><text x="20" y="61" class="node-copy">Occupancy or slow-time intensity</text><text x="20" y="84" class="node-copy">by selected time range</text></g>
  <g class="node output" transform="translate(390 800)"><rect width="260" height="105"/><text x="20" y="34" class="node-title">Area summary</text><text x="20" y="61" class="node-copy">Click a region to see vehicles,</text><text x="20" y="84" class="node-copy">peak time and problem counts</text></g>
  <g class="node output" transform="translate(700 800)"><rect width="260" height="105"/><text x="20" y="34" class="node-title">System health</text><text x="20" y="61" class="node-copy">Freshness, localization, UWB,</text><text x="20" y="84" class="node-copy">LiDAR and database health</text></g>
  <g class="node output" transform="translate(1010 800)"><rect width="300" height="105"/><text x="20" y="34" class="node-title">Replay and insights</text><text x="20" y="61" class="node-copy">Paths, confirmed stuck events,</text><text x="20" y="84" class="node-copy">congestion and worst windows</text></g>
  <rect x="1360" y="814" width="150" height="30" rx="15" class="pill"/><text x="1435" y="834" text-anchor="middle" class="pill-text">READ ONLY</text><text x="1360" y="870" class="node-copy">Dashboard reports data.</text><text x="1360" y="892" class="node-copy">It does not drive forklifts.</text>

  <rect x="40" y="970" width="1520" height="92" rx="20" fill="#17182a" stroke="#c58cff" stroke-width="2" stroke-dasharray="12 8"/><text x="66" y="1001" class="lane-title" fill="#d9b7ff">SIMULATION-ONLY MOVEMENT LOOP</text>
  <text x="66" y="1036" class="footer">AMCL pose + map + scan</text><path d="M260 1031H420" class="arrow-sim"/><text x="445" y="1036" class="footer">A* traffic simulator</text><path d="M620 1031H780" class="arrow-sim"/><text x="805" y="1036" class="footer">cmd_vel</text><path d="M885 1031H1045" class="arrow-sim"/><text x="1070" y="1036" class="footer">Gazebo vehicle physics</text><path d="M1270 1031H1400" class="arrow-sim"/><text x="1425" y="1025" text-anchor="middle" class="footer">simulated</text><text x="1425" y="1045" text-anchor="middle" class="footer">sensors</text>
</svg>
