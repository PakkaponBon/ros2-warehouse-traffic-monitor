# Docking points and spawn poses in Gazebo WORLD coordinates (metres).
# Docks are approach positions beside the stations, not inside their boxes.
loading_seconds: 4.0
unloading_seconds: 4.0
repeat_jobs: true
spawns:
  - {x: -16.0, y: 11.4, yaw: 0.0}
  - {x: -6.0, y: 11.4, yaw: 0.0}
  - {x: 7.0, y: 11.4, yaw: 3.141592653589793}
  - {x: 18.0, y: 11.4, yaw: 3.141592653589793}
stations:
  - {id: receiving, label: Receiving, x: -18.0, y: -9.4}
  - {id: warehouse_bay, label: Warehouse bay, x: -12.3, y: 3.2}
  - {id: process_north, label: Production north, x: 2.5, y: 5.1}
  - {id: process_south, label: Production south, x: 2.4, y: -4.5}
  - {id: fabrication_north, label: Fabrication north, x: 4.8, y: 5.1}
  - {id: fabrication_south, label: Fabrication south, x: 4.8, y: -5.1}
  - {id: shipping, label: Shipping, x: 13.5, y: -9.4}
  - {id: packing, label: Packing, x: 18.8, y: -8.0}
jobs:
  - {pickup: receiving, dropoff: process_north}
  - {pickup: warehouse_bay, dropoff: process_south}
  - {pickup: fabrication_north, dropoff: shipping}
  - {pickup: fabrication_south, dropoff: packing}
  - {pickup: process_north, dropoff: fabrication_north}
  - {pickup: process_south, dropoff: fabrication_south}
  - {pickup: shipping, dropoff: warehouse_bay}
  - {pickup: packing, dropoff: receiving}
